<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" width="100%" height="auto">
  <defs>
    <!-- Градиент для текста и иконки -->
    <linearGradient id="sfs-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2A4B" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>
    
    <!-- Эффект свечения -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Иконка: Динамичный спидометр / Стрела скорости -->
  <g transform="translate(10, 10)">
    <!-- Полосы скорости -->
    <path d="M 0 60 L 25 15 L 45 15 L 20 60 Z" fill="url(#sfs-gradient)" opacity="0.4" />
    <path d="M 20 60 L 45 15 L 65 15 L 40 60 Z" fill="url(#sfs-gradient)" opacity="0.7" />
    <path d="M 40 60 L 65 15 L 95 15 L 70 60 Z" fill="url(#sfs-gradient)" filter="url(#neon-glow)" />
    <!-- Стрелка спидометра -->
    <polygon points="50,50 85,20 75,55" fill="#FFFFFF" />
  </g>

  <!-- Типографика: SPEED FOR STREET -->
  <g transform="translate(115, 68)">
    <!-- Тень/Свечение -->
    <text font-family="'Impact', 'Arial Black', sans-serif" font-size="46" font-style="italic" font-weight="900" fill="url(#sfs-gradient)" filter="url(#neon-glow)" letter-spacing="2">
      SPEED<tspan fill="#FFFFFF">FOR</tspan>STREET
    </text>
  </g>
</svg>
