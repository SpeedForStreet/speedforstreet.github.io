name: Optimize manufacturer covers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image converter
        run: python -m pip install Pillow
      - name: Convert covers and update catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageOps

          catalog = Path("data/manufacturers.json")
          data = json.loads(catalog.read_text(encoding="utf-8"))
          converted = 0
          for item in data:
              raw = item.get("image")
              if not raw:
                  continue
              src = Path(raw)
              if src.suffix.lower() not in {".png", ".jpeg", ".jpg"} or not src.exists():
                  continue
              try:
                  with Image.open(src) as original:
                      image = ImageOps.exif_transpose(original)
                      if image.mode in ("RGBA", "LA") or (image.mode == "P" and "transparency" in image.info):
                          # Keep transparent assets unchanged; JPG has no alpha channel.
                          continue
                      image = image.convert("RGB")
                      max_width = 1800
                      if image.width > max_width:
                          height = round(image.height * max_width / image.width)
                          image = image.resize((max_width, height), Image.Resampling.LANCZOS)
                      dest = src.with_suffix(".jpg")
                      image.save(dest, "JPEG", quality=86, optimize=True, progressive=True)
                      item["image"] = dest.as_posix()
                      print(f"{src}: {src.stat().st_size:,} bytes -> {dest}: {dest.stat().st_size:,} bytes")
                      converted += 1
              except Exception as exc:
                  print(f"Skipping {src}: {exc}")
          catalog.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Converted {converted} manufacturer covers.")
          PY
      - name: Commit optimized covers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manufacturers.json assets/*.jpg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Optimize manufacturer cover images as JPEG"
            git push
          fi
