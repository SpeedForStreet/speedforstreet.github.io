name: Publish Telegram news

on:
  push:
    branches: [main]
    paths:
      - "data/news.json"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Read news and publish to Telegram Worker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NEWS_URL: https://raw.githubusercontent.com/SpeedForStreet/speedforstreet.github.io/main/data/news.json
          WORKER_URL: https://speedforstreet-telegram.yauheni-korshuk.workers.dev/broadcast
        run: |
          python - <<'PY2'
          import json, os, re, urllib.request, urllib.error\n\n          def plain_html(value):\n              value = value or ""\n              value = re.sub(r"<br\\s*/?>", "\\n", value, flags=re.I)\n              value = re.sub(r"</(p|div|h[1-6]|li|blockquote)>", "\\n", value, flags=re.I)\n              value = re.sub(r"<[^>]+>", "", value)\n              return value.strip()

          with urllib.request.urlopen(os.environ["NEWS_URL"]) as r:
              news = json.load(r)

          for item in news:
              if item.get("telegram") is True:
                  telegram_item = dict(item)\n                  telegram_item["text"] = plain_html(item.get("text") or item.get("fullDescription") or item.get("shortDescription") or "")\n                  payload = json.dumps(telegram_item, ensure_ascii=False).encode("utf-8")
                  req = urllib.request.Request(
                      os.environ["WORKER_URL"],
                      data=payload,
                      method="POST",
                      headers={
                          "Content-Type": "application/json",
                          "User-Agent": "Mozilla/5.0 (GitHubActions; SpeedForStreet Telegram Publisher)",
                          "X-Telegram-Bot-Token": os.environ["TELEGRAM_BOT_TOKEN"]
                      }
                  )
                  try:
                      with urllib.request.urlopen(req) as r:
                          print("Worker:", r.status, r.read().decode())
                  except urllib.error.HTTPError as e:
                      print("Worker error:", e.code, e.read().decode())
                      raise
          PY2
