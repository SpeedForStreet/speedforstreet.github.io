<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpeedForStreet — Admin</title><link rel="stylesheet" href="style.css"><style>
body{background:#07090d}.admin{max-width:1200px;margin:auto;padding:40px 5vw}.admin-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:30px}.admin h1{font:700 64px/0.9 Oswald;margin:0}.admin h1 em{color:#ff2438;font-style:normal}.admin-panel{background:#0e1219;border:1px solid rgba(255,255,255,.15);padding:25px;margin-bottom:20px}.admin-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.admin-tabs button,.admin button{border:1px solid rgba(255,255,255,.18);background:#121721;color:#fff;padding:11px 15px;cursor:pointer}.admin-tabs button.active,.admin .primary{background:#ff2438;border-color:#ff2438}.admin input,.admin textarea,.admin select{width:100%;background:#080b10;color:#fff;border:1px solid rgba(255,255,255,.15);padding:12px;margin-top:6px;font:inherit}.admin textarea{min-height:120px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{margin-bottom:14px}.field label{font-size:11px;letter-spacing:1px;color:#9ba2ad}.items{display:grid;gap:10px}.item{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:15px;border:1px solid rgba(255,255,255,.12);background:#0a0d12}.item small{color:#ff2438}.item h3{margin:4px 0}.item-actions{display:flex;gap:8px}.status{margin-top:12px;color:#9ba2ad}.danger{color:#fff;background:#321015!important;border-color:#ff2438!important}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.hint{color:#8d949f;line-height:1.6;font-size:13px}.hidden{display:none!important}@media(max-width:700px){.admin{padding:25px 5vw}.admin h1{font-size:44px}.form-grid{grid-template-columns:1fr}.admin-head{display:block}.item{display:block}.item-actions{margin-top:12px}}
</style></head>
<body><main class="admin"><div class="admin-head"><div><div class="section-label">SPEEDFORSTREET / ADMIN</div><h1>АДМИН<br><em>ПАНЕЛЬ.</em></h1></div><a class="btn-primary" href="index.html">НА САЙТ →</a></div>
<section class="admin-panel" id="auth"><h2 style="font-family:Oswald">ДОСТУП К GITHUB</h2><p class="hint">Для записи изменений нужен GitHub fine-grained token только с правом Contents: Read and write для репозитория SpeedForStreet/speedforstreet.github.io. Токен не сохраняется.</p><div class="field"><label>GITHUB TOKEN</label><input id="token" type="password" autocomplete="off" placeholder="github_pat_..."></div><button class="primary" id="connect">ПОДКЛЮЧИТЬСЯ</button><div class="status" id="authStatus"></div></section>
<section class="admin-panel hidden" id="workspace"><div class="top-actions"><button class="active" data-tab="cars">АВТОМОБИЛИ</button><button data-tab="news">НОВОСТИ</button><button id="reload">ОБНОВИТЬ</button></div>
<div id="carsTab"><div class="admin-head"><h2 style="font-family:Oswald">АВТОМОБИЛИ</h2><button class="primary" id="newCar">+ ДОБАВИТЬ АВТО</button></div><div class="items" id="carList"></div><div id="carEditor" class="admin-panel hidden"></div></div>
<div id="newsTab" class="hidden"><div class="admin-head"><h2 style="font-family:Oswald">НОВОСТИ</h2><button class="primary" id="newNews">+ ДОБАВИТЬ НОВОСТЬ</button></div><div class="items" id="newsList"></div><div id="newsEditor" class="admin-panel hidden"></div></div>
<div class="status" id="saveStatus"></div></section></main><script src="admin.js"></script></body></html>
